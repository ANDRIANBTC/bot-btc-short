name: Bot BTC Short 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Ejecutar Bot de Trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: .
        run: |
          # Busca el archivo tanto en la raíz como en la subcarpeta por seguridad
          if [ -f "bot.py" ]; then
            python bot.py
          elif [ -f "bot-btc-short/bot.py" ]; then
            python bot-btc-short/bot.py
          else
            # Si hay doble anidación, busca ahí
            python */bot.py
          fi
