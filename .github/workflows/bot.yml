name: Bot BTC Short 24/7

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta cada 15 minutos automáticamente
  workflow_dispatch:        # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Ejecutar Bot de Trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
